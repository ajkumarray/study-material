<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap Demo — Expenses</title>
  <!-- Component-based: pre-built, opinionated components + a 12-column grid.
       References the installed Bootstrap 5 dist (npm install bootstrap). -->
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />
</head>
<body class="bg-body-tertiary">
  <!-- Container + grid: Bootstrap's responsive layout system (rows & 12 columns). -->
  <main class="container py-5" style="max-width: 32rem;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Expenses</h1>
      <!-- "badge" — a ready-made component, styled by class name alone. -->
      <span class="badge text-bg-success fs-6">Total $1,042.50</span>
    </div>

    <!-- "list-group" — another prebuilt component. -->
    <ul class="list-group shadow-sm">
      <li class="list-group-item d-flex justify-content-between align-items-center py-3">
        <div>
          <div class="fw-medium">Lunch</div>
          <small class="text-secondary">food</small>
        </div>
        <span class="fw-semibold">$12.50</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center py-3">
        <div>
          <div class="fw-medium">Bus pass</div>
          <small class="text-secondary">transport</small>
        </div>
        <span class="fw-semibold">$30.00</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center py-3">
        <div>
          <div class="fw-medium">Rent</div>
          <small class="text-secondary">housing</small>
        </div>
        <span class="fw-semibold">$900.00</span>
      </li>
    </ul>

    <!-- "btn btn-primary" — the canonical Bootstrap component: consistent look for free. -->
    <button type="button" class="btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#addModal">
      + Add expense
    </button>

    <!-- A modal component driven by data-bs-* attributes + Bootstrap's JS bundle. -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" placeholder="Lunch" />
            </div>
            <div class="mb-3">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" placeholder="12.50" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap's JS bundle (Popper + components) powers the modal/dropdowns/etc. -->
  <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
